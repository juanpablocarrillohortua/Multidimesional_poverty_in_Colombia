# PEP 8 configuration for utils/, data_loader/ and notebooks/.
# Driven by the Makefile: `make lint`, `make format`, `make quality`.

line-length = 79            # PEP 8 hard limit; raise to 88/100 if too noisy
target-version = "py313"
extend-include = ["*.ipynb"]  # lint notebooks cell by cell

# Excluido a propósito: data_loader/dataloader.py viene casi literal del
# baseline de LUNA25 (DIAGNijmegen/luna25-baseline-public) y su propio
# docstring lo marca PLACEHOLDER. Sus hallazgos son estilo de upstream
# --la mayoría nombres camelCase (N802/N803/N806)-- y arreglarlos haría
# ilegible cualquier diff contra el original. Se revisará cuando el
# módulo se reescriba, no antes. data_loader/unzip_data.py sí se revisa.
extend-exclude = ["data_loader/dataloader.py"]

# Sin esto la exclusión solo aplica cuando ruff descubre el archivo
# recorriendo un directorio, que es lo que hace el Makefile. Una ruta de
# archivo explícita --la que manda la extensión del editor-- se saltaría
# la exclusión y el archivo seguiría marcado.
force-exclude = true

[lint]
select = [
    "E",  # pycodestyle errors   - the core PEP 8 rules
    "W",  # pycodestyle warnings
    "F",  # pyflakes             - unused imports and variables
    "I",  # isort                - PEP 8 import ordering
    "N",  # pep8-naming          - PEP 8 naming conventions
]

# Rules that are still REPORTED by `make lint`, but that `make format` is not
# allowed to auto-fix, because their fix deletes code. In exploratory and
# notebook work you routinely write an import or an assignment before you use
# it; letting --fix strip those empties the file.
unfixable = [
    "F401",  # unused import        -> deletes the import line
    "F811",  # redefined-while-unused -> deletes the earlier definition
    "F841",  # unused local variable  -> deletes the assignment
]

[lint.per-file-ignores]
# E402: notebooks legitimately import after prose and setup cells.
# F401: an EDA notebook imports its whole toolkit in the first cell
#       (numpy, matplotlib, seaborn) and reaches for it several cells
#       later, so "unused import" is noise here rather than a defect.
#       Still enforced everywhere else.
"*.ipynb" = ["E402", "F401"]

[format]
docstring-code-format = true

[lint.pep8-naming]
ignore-names = [
    "X",
    "X_with_const",
    "M",
    "R",
    "invW_T",
    "W",
    "B"
    ]

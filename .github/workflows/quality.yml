name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push nuevo cancela el run anterior de la misma rama.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Misma version que el venv local y que target-version en ruff.toml.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install tooling
        run: make install-dev

      # clean + lint + format-check. El Makefile cae a `python` porque
      # .venv/ esta en .gitignore y no existe en el runner.
      - name: make quality
        run: make quality
